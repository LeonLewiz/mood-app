#cloud-config

package_update: true
packages:
  - curl
  - ca-certificates

write_files:
  - path: /usr/local/bin/install-k3s.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      # В сертификат попадает имя, а не адрес. Публичный адрес узла заранее
      # неизвестен, его выдаёт балансировщик, поэтому имя и /etc/hosts на
      # машине, с которой ты подключаешься.
      curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--tls-san ${api_hostname}" sh -
      mkdir -p /home/ubuntu/.kube
      k3s kubectl config view --raw > /home/ubuntu/.kube/config
      sed -i "s|127.0.0.1|${api_hostname}|" /home/ubuntu/.kube/config
      chown -R ubuntu:ubuntu /home/ubuntu/.kube
      chmod 600 /home/ubuntu/.kube/config

runcmd:
  - [bash, /usr/local/bin/install-k3s.sh]
