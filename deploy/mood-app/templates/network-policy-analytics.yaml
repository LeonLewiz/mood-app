apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: mood-analytics
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: mood-frontend
    ports:
    - protocol: TCP
      port: 8001
