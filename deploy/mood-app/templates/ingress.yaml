apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mood-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "local-selfsigned-issuer"
    traefik.ingress.kubernetes.io/router.middlewares: default-test-rate-limit@kubernetescrd
spec:
  tls:
  - hosts:
    - mood.local
    secretName: mood-local-tls-cert
  rules:
  - host: mood.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
