apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mood-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "{{ .Values.ingress.clusterIssuer }}"
    # в Traefik имя middleware выглядит как <namespace>-<имя>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-test-rate-limit@kubernetescrd"
spec:
  tls:
  - hosts:
    - "{{ .Values.ingress.host }}"
    secretName: {{ .Values.ingress.tlsSecret }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: {{ .Values.frontend.port }}
