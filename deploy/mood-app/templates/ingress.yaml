apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mood-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.middlewares: default-test-rate-limit
spec:
  rules:
  - host: mood.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000
