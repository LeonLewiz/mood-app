apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mood-analytics-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mood-analytics
  minReplicas: {{ .Values.autoscaling.analytics.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.analytics.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.analytics.targetCPUUtilizationPercentage }}
