apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-analytics
spec:

  selector:
    matchLabels:
      app: mood-analytics
  template:
    metadata:
      labels:
        app: mood-analytics
    spec:
      containers:
      - name: analytics
        image: "{{ .Values.analytics.image.repository }}:{{ .Values.analytics.image.tag }}"
        ports:
        - containerPort: 8001
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: PORT
          value: "8001"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: mood-analytics