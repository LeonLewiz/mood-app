apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-analytics
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: mood-analytics
  template:
    metadata:
      labels:
        app: mood-analytics
      annotations:
        # агент OpenTelemetry из оператора, трассы уходят в Tempo
        instrumentation.opentelemetry.io/inject-python: "python"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: analytics
        image: "{{ .Values.analytics.repository }}:{{ .Values.analytics.tag }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: {{ .Values.analytics.port }}
        resources:
          {{- toYaml .Values.analytics.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.analytics.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.analytics.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: PORT
          value: "{{ .Values.analytics.port }}"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - port: {{ .Values.analytics.port }}
    targetPort: {{ .Values.analytics.port }}
  selector:
    app: mood-analytics
