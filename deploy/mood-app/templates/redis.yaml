apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mood-redis
  template:
    metadata:
      labels:
        app: mood-redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          value: "TemporaryPasswordBeforeLockbox"
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
  selector:
    app: mood-redis
