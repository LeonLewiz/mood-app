---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: mood-frontend
  template:
    metadata:
      labels:
        app: mood-frontend
      annotations:
        # агент OpenTelemetry из оператора, трассы уходят в Tempo
        instrumentation.opentelemetry.io/inject-python: "python"
    spec:
      # Запуск не от root. uid/gid берём у самого образа (appuser = 10001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: "{{ .Values.frontend.repository }}:{{ .Values.frontend.tag }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: {{ .Values.frontend.port }}
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.frontend.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.frontend.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: PORT
          value: "{{ .Values.frontend.port }}"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "{{ .Values.redis.port }}"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.passwordSecret }}
              key: redis-password
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:{{ .Values.analytics.port }}"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{ .Release.Namespace }}
  # Метка нужна ServiceMonitor'у: он выбирает сервис по ней, а selector ниже
  # выбирает поды, это разные вещи. Без метки Prometheus цель не видит.
  labels:
    app: mood-frontend
spec:
  ports:
  # Порт назван специально: ServiceMonitor ищет цель по имени порта.
  - name: web
    port: {{ .Values.frontend.port }}
    targetPort: {{ .Values.frontend.port }}
  selector:
    app: mood-frontend

