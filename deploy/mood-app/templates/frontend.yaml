apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: mood-frontend
  template:
    metadata:
      labels:
        app: mood-frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: "TemporaryPasswordBeforeLockbox"
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: mood-frontend
