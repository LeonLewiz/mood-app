apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-frontend
spec:
  selector:
    matchLabels:
      app: mood-frontend
  template:
    metadata:
      labels:
        app: mood-frontend
      annotations:
        # агент OpenTelemetry из оператора, трассы уходят в Tempo
        instrumentation.opentelemetry.io/inject-python: "python"
    spec:
      # Запуск не от root. uid/gid берём у самого образа (appuser = 10001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: "{{ .Values.frontend.repository }}:{{ .Values.frontend.tag }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: PORT
          value: "8000"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-production-secret
              key: redis-password
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  # Метка нужна ServiceMonitor'у: он выбирает сервис по ней, а selector ниже
  # выбирает поды, это разные вещи. Без метки Prometheus цель не видит.
  labels:
    app: mood-frontend
spec:
  ports:
  # Порт назван специально: ServiceMonitor ищет цель по имени порта.
  - name: web
    port: 8000
    targetPort: 8000
  selector:
    app: mood-frontend
