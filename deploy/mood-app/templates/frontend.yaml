apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-frontend
spec:
  selector:
    matchLabels:
      app: mood-frontend
  template:
    metadata:
      labels:
        app: mood-frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m" 
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-production-secret
              key: redis-password
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: mood-frontend
