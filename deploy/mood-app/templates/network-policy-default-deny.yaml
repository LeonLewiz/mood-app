# Базовый сетевой запрет для всего namespace: ни входящий, ни исходящий трафик,
# пока его не разрешат другие политики.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mood-default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
# Разрешаем всем подам namespace ходить в DNS (CoreDNS/kube-dns в kube-system).
# БЕЗ ЭТОГО ПРАВИЛА ВСЁ ЛОМАЕТСЯ
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mood-allow-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
