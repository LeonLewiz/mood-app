# значения чарта kube-prometheus-stack, версия пинована в app-kube-prometheus.yaml, файл лежит вне путей Application'ов

# В k3s этих компонентов нет отдельными подами, метрик для них не существует
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeScheduler: false
    kubeProxy: false

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Иначе селекторы ServiceMonitor/PodMonitor ограничены меткой релиза Helm
    # (release: kube-prometheus), и наши service-monitor*.yaml не скрейпятся.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # том под метрики, иначе история теряется при рестарте пода (в чарте поле storageSpec, в объекте storage)
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  admin:
    # пароль админа Grafana: чарт генерирует его случайно, поэтому лежит в SealedSecret
    existingSecret: grafana-admin
  # Ключ называется буквально grafana.ini, поэтому получается grafana.grafana.ini:
  # так устроен вложенный чарт Grafana внутри kube-prometheus-stack.
  grafana.ini:
    server:
      # Чтобы ссылки и редиректы внутри Grafana вели на внешний адрес, а не на
      # внутренний сервис
      root_url: https://grafana.mood.local

alertmanager:
  alertmanagerSpec:
    # То же для Alertmanager: этот адрес он подставляет в уведомления
    externalUrl: https://alertmanager.mood.local
    # Том под silences и историю уведомлений, иначе они теряются при рестарте.
    # StorageClass не указываем, подставится дефолтный (в k3s local-path).
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    # Лимиты, чтобы не съел память соседей
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 256Mi
