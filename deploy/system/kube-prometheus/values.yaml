# Значения для чарта kube-prometheus-stack.
# Версия чарта пинована в deploy/system/argocd/apps/app-kube-prometheus.yaml.
#
# Лежит вне путей, которые тянут Application'ы: ArgoCD разбирает любой .yaml из
# своей папки как манифест кластера, и этот файл сломал бы app-monitoring.

prometheus:
  prometheusSpec:
    # Иначе селекторы ServiceMonitor/PodMonitor ограничены меткой релиза Helm
    # (release: kube-prometheus), и наши service-monitor*.yaml не скрейпятся.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # История метрик тоже живёт в томе: живое хранилище — это единственный
    # способ пережить рестарт пода без дыр на графиках.
    # Внимание: в values чарта поле называется storageSpec, хотя в самом
    # объекте Prometheus оно превращается в storage. У Alertmanager и в values,
    # и в объекте — просто storage.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  admin:
    # Пароль админа чарт генерирует случайно при каждом рендере: ArgoCD видел бы
    # вечный OutOfSync, а под Grafana перезапускался бы на каждом синке.
    # Пароль лежит в SealedSecret (grafana-admin-sealed-secret.yaml).
    existingSecret: grafana-admin

alertmanager:
  alertmanagerSpec:
    # Без хранилища Alertmanager держит silences и историю отправленных
    # уведомлений только в памяти пода: рестарт — и они пропали.
    # StorageClass не указываем, подставится дефолтный (в k3s это local-path).
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    # Лимиты, чтобы Alertmanager не съел память соседей на одном узле
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 256Mi
