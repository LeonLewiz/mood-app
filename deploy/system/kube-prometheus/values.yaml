# Значения для чарта kube-prometheus-stack.
# Версия чарта пинована в deploy/system/argocd/apps/app-kube-prometheus.yaml.
# Лежит вне путей Application'ов: ArgoCD разбирает любой .yaml из своей папки
# как манифест кластера, и этот файл сломал бы app-monitoring.

prometheus:
  prometheusSpec:
    # Иначе селекторы ServiceMonitor/PodMonitor ограничены меткой релиза Helm
    # (release: kube-prometheus), и наши service-monitor*.yaml не скрейпятся.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Том под метрики, иначе история теряется при рестарте пода.
    # В values чарта поле зовётся storageSpec, а в объекте Prometheus становится
    # storage. У Alertmanager и там, и там storage.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  admin:
    # Пароль админа чарт генерирует случайно при каждом рендере: ArgoCD видел бы
    # вечный OutOfSync, а под Grafana перезапускался бы на каждом синке.
    # Пароль лежит в SealedSecret (grafana-admin-sealed-secret.yaml).
    existingSecret: grafana-admin
  # Ключ называется буквально grafana.ini, поэтому получается grafana.grafana.ini:
  # так устроен вложенный чарт Grafana внутри kube-prometheus-stack.
  grafana.ini:
    server:
      # Чтобы ссылки и редиректы внутри Grafana вели на внешний адрес, а не на
      # внутренний сервис
      root_url: https://grafana.mood.local

alertmanager:
  alertmanagerSpec:
    # То же для Alertmanager: этот адрес он подставляет в уведомления
    externalUrl: https://alertmanager.mood.local
    # Том под silences и историю уведомлений, иначе они теряются при рестарте.
    # StorageClass не указываем, подставится дефолтный (в k3s local-path).
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    # Лимиты, чтобы не съел память соседей
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 256Mi
