# Вход в UI Alertmanager и Grafana через Traefik. Сертификаты выпускает
# cert-manager, issuer local-selfsigned-issuer (самоподписанный, браузер будет
# ругаться, пока сертификат не добавлен в доверенные).
# Имена должны резолвиться на 127.0.0.1, как mood.local и jaeger.mood.local.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: local-selfsigned-issuer
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - alertmanager.mood.local
      secretName: alertmanager-mood-local-tls
  rules:
    - host: alertmanager.mood.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-kube-prome-alertmanager
                port:
                  number: 9093
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: local-selfsigned-issuer
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.mood.local
      secretName: grafana-mood-local-tls
  rules:
    - host: grafana.mood.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-grafana
                port:
                  number: 80
