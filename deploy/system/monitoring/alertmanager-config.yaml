# Маршрутизация алертов Alertmanager. Сам Alertmanager объект создаёт чарт
# kube-prometheus-stack, а правила доставки живут здесь отдельным объектом:
# у Alertmanager селекторы пустые, поэтому он подхватывает любой
# AlertmanagerConfig в своём namespace.

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: mood-alerts
  namespace: monitoring
spec:
  route:
    receiver: telegram
    # Группировка: алерты с одинаковым alertname и namespace уезжают одним
    # сообщением, а не по одному на каждый под.
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    # Пока алерт горит, повторяем не чаще раза в 4 часа
    repeatInterval: 4h
  receivers:
    - name: telegram
      telegramConfigs:
        # Токен бота берётся из Secret, а не из этого файла: в репозитории он
        # лежит зашифрованным (telegram-bot-sealed-secret.yaml).
        - botToken:
            name: telegram-bot
            key: bot-token
          chatID: 5534301096
          # Присылать и уведомление о том, что алерт прошёл
          sendResolved: true
