# Демо-приёмник уведомлений: печатает в лог всё, что ему присылает Alertmanager.
# Нужен, чтобы канал уведомлений можно было проверить, а не верить на слово.
# В настоящей жизни на его месте Telegram, Slack или PagerDuty: меняется только
# url получателя в alertmanager-config.yaml.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-sink
  template:
    metadata:
      labels:
        app: alert-sink
    spec:
      containers:
        - name: sink
          image: mendhak/http-https-echo:31
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  selector:
    app: alert-sink
  ports:
    - name: http
      port: 8080
      targetPort: http
