# пароль админа Grafana: чарт генерирует его случайно, поэтому лежит здесь (перезапечатать: kubeseal из Secret grafana-admin)

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
