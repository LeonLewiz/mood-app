apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jaeger-monitor
  namespace: default
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      # Метки сервиса jaeger-collector
      app.kubernetes.io/name: jaeger-collector
  endpoints:
  - port: admin-http
    path: /metrics
    interval: 30s
    relabelings:
    # headless-сервис имеет те же метки, иначе под скрейпится дважды
    - sourceLabels: [__meta_kubernetes_service_name]
      regex: jaeger-collector
      action: keep
