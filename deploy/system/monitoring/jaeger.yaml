apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: jaeger
spec:
  strategy: allInOne
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: local-selfsigned-issuer
    hosts:
      - jaeger.mood.local
    tls:
      - hosts:
          - jaeger.mood.local
        secretName: jaeger-tls