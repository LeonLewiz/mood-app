apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-platform-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/LeonLewiz/platform'
    targetRevision: HEAD
    path: deploy/system/argocd/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
