apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-cert-manager
  namespace: argocd
  annotations:
    # webhook caBundle чарт отдаёт пустым, его дописывает cert-manager, поэтому ServerSideDiff
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    # 1. Наш репозиторий как источник значений
    - repoURL: 'git@github.com:LeonLewiz/platform.git'
      targetRevision: main
      ref: values
    # 2. Чарт из helm-репы, версия пинована
    - repoURL: 'https://charts.jetstack.io'
      chart: cert-manager
      targetRevision: 1.21.2
      helm:
        # Имя релиза задаёт имена объектов, поэтому совпадает с тем релизом,
        # который стоял в кластере до переезда в GitOps.
        releaseName: cert-manager
        valueFiles:
          - $values/deploy/system/helm/cert-manager.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD и webhook-конфиги не влезают в client-side apply
      - ServerSideApply=true
