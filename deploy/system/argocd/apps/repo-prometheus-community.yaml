# Helm-репа prometheus-community для ArgoCD.
# С ноутбука helm её видит, а ArgoCD нет: у него свои подключения к источникам.
# Репа публичная, креденшелы не нужны.
# Лежит рядом с Application'ами, чтобы создавал её root-app, а не argocd repo add.

apiVersion: v1
kind: Secret
metadata:
  name: repo-prometheus-community
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: prometheus-community
  type: helm
  url: https://prometheus-community.github.io/helm-charts
