# Регистрация helm-репы prometheus-community в ArgoCD.
# ArgoCD не видит helm-репы с ноутбука, у него свои подключения к источникам.
# Поэтому описываем её декларативно и кладём рядом с Application'ами — создаст root-app,
# а не команда argocd repo add руками.
# Репа публичная, креденшелы не нужны.

apiVersion: v1
kind: Secret
metadata:
  name: repo-prometheus-community
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: prometheus-community
  type: helm
  url: https://prometheus-community.github.io/helm-charts
