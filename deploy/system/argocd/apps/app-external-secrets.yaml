apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-external-secrets
  namespace: argocd
  annotations:
    # Секрет с сертификатом для webhook чарт отдаёт пустым, а ключи в него
    # дописывает сам контроллер. ServerSideDiff такие поля расхождением не
    # считает, иначе приложение вечно в OutOfSync, а selfHeal ещё и пытался бы
    # затирать живые сертификаты.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: 'git@github.com:LeonLewiz/platform.git'
      targetRevision: main
      ref: values
    - repoURL: 'https://external-secrets.io'
      chart: external-secrets
      targetRevision: 2.12.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/deploy/system/helm/external-secrets.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
