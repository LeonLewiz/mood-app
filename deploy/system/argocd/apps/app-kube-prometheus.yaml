apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-kube-prometheus
  namespace: argocd
spec:
  project: default
  sources:
    # 1. Наш репозиторий только как источник значений, ref: values даёт ссылку
    #    на них вида $values/<путь от корня репы>.
    - repoURL: 'git@github.com:LeonLewiz/mood-app.git'
      targetRevision: main
      ref: values
    # 2. Чарт из helm-репы. targetRevision это версия чарта, не ветка, чтобы
    #    обновление мониторинга было отдельным коммитом.
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 92.3.0
      helm:
        # Имя релиза задаёт имена всех объектов (kube-prometheus-*), поэтому
        # совпадает с релизом, который стоял в кластере до переезда в GitOps.
        releaseName: kube-prometheus
        valueFiles:
          - $values/deploy/system/kube-prometheus/values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Namespace monitoring создаёт сам ArgoCD
      - CreateNamespace=true
      # CRD мониторинга не влезают в client-side apply (лимит аннотации
      # last-applied-configuration), поэтому применяем server-side.
      - ServerSideApply=true
