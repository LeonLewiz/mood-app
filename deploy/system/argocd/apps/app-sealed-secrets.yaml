apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-sealed-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'git@github.com:LeonLewiz/mood-app.git'
      targetRevision: main
      ref: values
    - repoURL: 'https://bitnami.github.io/sealed-secrets'
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        # Имя релиза не совпадает с именем чарта: именно на него завязаны имена
        # объектов контроллера, и оно же было у релиза, который ставился руками.
        releaseName: sealed-secrets-controller
        valueFiles:
          - $values/deploy/system/helm/sealed-secrets.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    # Контроллер живёт в kube-system, namespace уже существует
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
