apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://jaegertracing.github.io/helm-charts'
    chart: jaeger-operator
    targetRevision: "2.57.0"
    helm:
      # ВАЖНО: clusterRole=true даёт оператору права на кластерные ресурсы
      # (в т.ч. ingressclasses) и переводит его в режим "следить за всеми namespace".
      # Без этого Jaeger CR в namespace default не поднимается.
      values: |
        rbac:
          clusterRole: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jaeger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
