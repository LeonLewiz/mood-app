apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-monitoring
  namespace: argocd
  annotations:
    # CRD Jaeger подставляет дефолты, обычный diff видит OutOfSync, поэтому ServerSideDiff
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: 'git@github.com:LeonLewiz/platform.git'
    targetRevision: main
    path: deploy/system/monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
