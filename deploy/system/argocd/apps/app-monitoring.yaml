apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/LeonLewiz/platform'
    targetRevision: HEAD
    path: deploy/system/monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
