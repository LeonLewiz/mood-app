apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-monitoring
  namespace: argocd
  annotations:
    # CRD Jaeger подставляет в spec много значений по умолчанию (agent, allInOne,
    # collector, storage...). Обычный diff считает это расхождением и приложение
    # вечно висит в OutOfSync. ServerSideDiff считает diff через dry-run apply,
    # поэтому дефолты CRD за расхождение не держит.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: 'git@github.com:LeonLewiz/platform.git'
    targetRevision: main
    path: deploy/system/monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
