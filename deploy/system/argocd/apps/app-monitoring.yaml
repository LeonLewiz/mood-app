apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:LeonLewiz/platform.git'
    targetRevision: main
    path: deploy/system/monitoring
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  # Оператор Jaeger дописывает в CR свою метку, из-за этого ArgoCD показывал
  # вечный OutOfSync. Игнорируем поля, которыми владеет оператор.
  ignoreDifferences:
  - group: jaegertracing.io
    kind: Jaeger
    managedFieldsManagers:
    - jaeger-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
