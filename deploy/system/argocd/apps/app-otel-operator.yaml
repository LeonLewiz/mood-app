apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-otel-operator
  namespace: argocd
spec:
  project: default
  sources:
    # наш репозиторий только как источник значений, ref: values даёт ссылку вида $values/<путь>
    - repoURL: 'git@github.com:LeonLewiz/platform.git'
      targetRevision: main
      ref: values
    - repoURL: 'https://open-telemetry.github.io/opentelemetry-helm-charts'
      chart: opentelemetry-operator
      targetRevision: 0.125.0
      helm:
        releaseName: opentelemetry-operator
        valueFiles:
          - $values/deploy/system/helm/opentelemetry-operator.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: opentelemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
