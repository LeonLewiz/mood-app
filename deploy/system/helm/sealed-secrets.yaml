# Значения для чарта sealed-secrets.
# Здесь пусто намеренно: контроллер ставится на дефолтах чарта, как и раньше.
#
# Важно: ключ, которым запечатаны секреты, чартом не создаётся. Он генерируется
# самим контроллером при первом старте и лежит в kube-system с меткой
# sealedsecrets.bitnami.com/sealed-secrets-key=active.
# Потеряешь ключ - запечатанные секреты в репозитории не расшифруются,
# их придётся запечатывать заново. Бэкап ключа: см. README.
