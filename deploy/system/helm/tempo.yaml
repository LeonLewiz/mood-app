# значения чарта grafana/tempo, версия чарта зафиксирована в app-tempo.yaml

tempo:
  retention: 72h
  # чарт по умолчанию просит балласт в 1 гигабайт, он не влезает в лимит и Tempo падает по памяти
  memBallastSizeMbs: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

# трассы на диске, иначе теряются при перезапуске пода
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

serviceMonitor:
  enabled: true
