# значения чарта grafana/tempo, версия чарта зафиксирована в app-tempo.yaml

tempo:
  # сколько хранить трассы
  retention: 72h
  # лимит по памяти, чтобы Tempo не съел память ноутбука
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# трассы на диске, иначе теряются при перезапуске пода
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

# метрики Tempo в Prometheus
serviceMonitor:
  enabled: true
