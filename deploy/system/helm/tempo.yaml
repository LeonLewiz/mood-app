# значения чарта grafana/tempo, версия чарта зафиксирована в app-tempo.yaml

tempo:
  retention: 72h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# трассы на диске, иначе теряются при перезапуске пода
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

serviceMonitor:
  enabled: true
