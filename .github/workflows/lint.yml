name: Lint Manifests

'on':
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'

  push:
    branches: ["main"]
    paths:
      - "**/*.yaml"
      - "**/*.yml"

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Lint YAML files
        run: yamllint .