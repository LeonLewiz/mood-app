name: Lint Manifests

'on':
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'

  push:
    branches: ["main"]
    paths:
      - "**/*.yaml"
      - "**/*.yml"

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Lint YAML files
        run: yamllint .

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render chart
        run: helm template mood-app deploy/mood-app > rendered.yaml

      - name: Validate manifests
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.8.0-alpine \
            -summary \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-filename-pattern 'helm|values\.yaml' \
            rendered.yaml \
            ./deploy/system

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHGUB_TOKEN  }}

