name: CI/CD (Build & GitOps)

'on':
  push:
    branches: ["main"]
    paths:
      - "apps/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Download Monorepo
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Hadolint.
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./apps/analytics/Dockerfile

      - name: Frontend Hadolint.
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./apps/frontend/Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Analytics
        uses: docker/build-push-action@v5
        with:
          context: ./apps/analytics
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mood-analytics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mood-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm values.yaml with new tags
        run: |
          # точечная замена: разбор и запись файла целиком стирают комментарии
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" deploy/mood-app/values.yaml

      - name: Commit and Push changes to Monorepo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/mood-app/values.yaml
          git commit -m "chore(gitops): auto-update image tags to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin main
